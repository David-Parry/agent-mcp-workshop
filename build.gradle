
plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.0'
    id 'jacoco'
}

group = 'com.workshop.mcp'
version = '0.0.1'
jar.enabled = false

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    
    // Maven Central repository (explicit configuration)
    maven {
        name = "maven-central"
        url = "https://repo.maven.apache.org/maven2/"
        mavenContent {
            releasesOnly()
        }
    }
    
    // Gradle Libraries Releases Repository
    maven {
        name = "gradle-libs-releases"
        url = "https://repo.gradle.org/gradle/libs-releases"
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Provide a launcher aligned with the platform engine version; otherwise Gradle
    // injects its own (older) launcher and JUnit fails discovery with an
    // "OutputDirectoryProvider not available" version-mismatch error.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    // Byte Buddy must support the Java 25 class file format (v69) to mock/instrument
    // classes at runtime. Force the latest so Mockito can run on JDK 25.
    testImplementation 'net.bytebuddy:byte-buddy:1.18.11'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.18.11'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.workshop.mcp.Runner'  // New way to specify main class
}

// Configure the JAR task
jar {
    manifest {
        attributes(
            'Main-Class': 'com.workshop.mcp.Runner',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

// Configure the Shadow plugin for creating the uber JAR
shadowJar {
    archiveBaseName.set('agent-mcp-workshop')
    archiveClassifier.set('')  // Removes the '-all' classifier from the JAR name
    archiveVersion.set(project.version)
    mergeServiceFiles()  // Properly handles service files in META-INF
}

// Make the shadowJar task run when the build task runs
build {
    dependsOn shadowJar
}


tasks.named('startScripts') {
    dependsOn shadowJar
}

tasks.named('javadoc') {
    include '**/com/workshop/mcp/spec/**'
}

// Configure JaCoCo test report
jacocoTestReport {
    dependsOn test // tests are required to run before generating the report

    reports {
        xml.required = true
        html.required = true
        csv.required = false

        // Set custom output directory for HTML report (optional)
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat = 'full'

        // Show reasons for skipped tests
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "\nTest result: ${result.resultType}"
                println "Test summary: ${result.testCount} tests, " +
                        "${result.successfulTestCount} succeeded, " +
                        "${result.failedTestCount} failed, " +
                        "${result.skippedTestCount} skipped "
            }
        }
    }
}