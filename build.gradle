
plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'jacoco'
}

group = 'com.workshop.mcp'
version = '0.0.1'
jar.enabled = false

// Pin the language level rather than the JDK. Students arrive with anything from
// 21 to 25, and setup asks only for "21 or later", so a toolchain block would
// hard-fail everyone who does not happen to have that exact JDK installed —
// there is no auto-provisioner configured to go and fetch it. Setting release
// instead compiles against the Java 21 API on whichever JDK is present, so the
// class files a student produces match the ones the lessons describe.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
    
    // Maven Central repository (explicit configuration)
    maven {
        name = "maven-central"
        url = "https://repo.maven.apache.org/maven2/"
        mavenContent {
            releasesOnly()
        }
    }
    
    // Gradle Libraries Releases Repository
    maven {
        name = "gradle-libs-releases"
        url = "https://repo.gradle.org/gradle/libs-releases"
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Keep the launcher aligned with the engine instead of Gradle's bundled (older) one
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 5.20+ ships Byte Buddy 1.17.8+, which can instrument Java 25 bytecode (class file 69)
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.workshop.mcp.Runner'  // New way to specify main class
}

// Configure the JAR task
jar {
    manifest {
        attributes(
            'Main-Class': 'com.workshop.mcp.Runner',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

// Configure the Shadow plugin for creating the uber JAR
shadowJar {
    archiveBaseName.set('agent-mcp-workshop')
    archiveClassifier.set('')  // Removes the '-all' classifier from the JAR name
    archiveVersion.set(project.version)
    mergeServiceFiles()  // Properly handles service files in META-INF
}

// Make the shadowJar task run when the build task runs
build {
    dependsOn shadowJar
}


tasks.named('startScripts') {
    dependsOn shadowJar
}

tasks.named('javadoc') {
    include '**/com/workshop/mcp/spec/**'
}

// Configure JaCoCo test report
jacocoTestReport {
    dependsOn test // tests are required to run before generating the report

    reports {
        xml.required = true
        html.required = true
        csv.required = false

        // Set custom output directory for HTML report (optional)
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

// The one class coverage cannot reach. Runner.main installs the real stdio
// handler and blocks until the JVM exits, so exercising it in-process calls
// System.exit and takes the test runner down with it. It holds no logic of its
// own — three constructor calls and a start() — and everything it wires up is
// covered directly by ServerTest and IOHandlerImplTest.
def coverageExclusions = ['com/workshop/mcp/Runner.class']

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        // Every class but IORouter is fully covered and must stay that way.
        rule {
            element = 'CLASS'
            excludes = ['com.workshop.mcp.Runner', 'com.workshop.mcp.IORouter']
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }

        // IORouter is fully covered on instructions, and on 118 of its 119
        // branches. The odd one out is not code anyone wrote: javac emits a
        // default target for a switch over an enum even when every value that
        // can reach it is handled, and JaCoCo counts that synthetic target as
        // a branch. INBOUND_METHODS gates the switch, so nothing else can
        // arrive at it.
        //
        // Keep the floor loose enough for that one branch but tight enough to
        // catch a second: 0.99 of 119 admits exactly one miss, and the branch
        // count shrinks whenever code leaves this class, so a stale floor
        // silently buys slack. It was 135 branches before the roots removal.
        rule {
            element = 'CLASS'
            includes = ['com.workshop.mcp.IORouter']
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.99
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        }))
    }
}

// Coverage is verified as part of `check`, so a regression fails the build
// rather than quietly showing up in a report nobody opened. The report is
// built alongside it so there is something to read when it does fail.
check {
    dependsOn jacocoTestReport, jacocoTestCoverageVerification
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat = 'full'

        // Show reasons for skipped tests
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "\nTest result: ${result.resultType}"
                println "Test summary: ${result.testCount} tests, " +
                        "${result.successfulTestCount} succeeded, " +
                        "${result.failedTestCount} failed, " +
                        "${result.skippedTestCount} skipped "
            }
        }
    }
}

// The self-check a student runs while working through a chapter:
//
//     ./gradlew chapterTest -Pchapter=03
//
// It runs only the tests tagged for that chapter, so the failures a student
// sees are about the code they are currently writing. Running the full `test`
// task on a chapter branch reports failures from every chapter not yet
// reached, which buries the ones that matter.
//
// This deliberately skips the coverage gate. Coverage is a property of the
// finished server, not of a chapter in progress.
tasks.register('chapterTest', Test) {
    group = 'verification'
    description = 'Runs one chapter\'s tests, e.g. ./gradlew chapterTest -Pchapter=03'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Accept 3 or 03 so a student who types the obvious thing is not punished.
    def requested = providers.gradleProperty('chapter').getOrNull()
    def chapter = requested?.trim()?.padLeft(2, '0')

    useJUnitPlatform {
        // An unmatched tag would run everything, so fall back to a tag that
        // deliberately matches nothing and let doFirst report the real problem.
        includeTags(chapter ? "chapter${chapter}" : 'chapter-not-specified')
    }

    doFirst {
        if (!chapter) {
            throw new GradleException(
                    'Which chapter? Pass one, for example: ./gradlew chapterTest -Pchapter=01')
        }
        if (!(chapter ==~ /0[1-7]/)) {
            throw new GradleException(
                    "There is no chapter '${requested}'. The workshop has chapters 01 to 07.")
        }
        println "Running the chapter ${chapter} tests. Red until your implementation is right."
    }

    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'

        afterSuite { desc, result ->
            if (!desc.parent) {
                if (result.testCount == 0) {
                    println "\nNo tests are tagged for chapter ${chapter}."
                } else if (result.failedTestCount == 0) {
                    println "\nChapter ${chapter}: all ${result.testCount} tests pass. On to the next one."
                } else {
                    println "\nChapter ${chapter}: ${result.failedTestCount} of ${result.testCount} " +
                            'tests still failing.'
                }
            }
        }
    }
}